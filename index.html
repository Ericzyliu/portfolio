<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>股票與負債總覽</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1f23;--mu:#6b7078;--bd:#e3e1da;--ac:#1f6f5c;--up:#1e8449;--dn:#c0392b;--debt:#b9532b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161a;--card:#1d2026;--tx:#eceef1;--mu:#9aa0a9;--bd:#2b2f37;--ac:#4fb89e;--up:#4cc27f;--dn:#ff6b5e;--debt:#e58a5f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161a;--card:#1d2026;--tx:#eceef1;--mu:#9aa0a9;--bd:#2b2f37;--ac:#4fb89e;--up:#4cc27f;--dn:#ff6b5e;--debt:#e58a5f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
main{max-width:920px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mu);font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.k{font-size:12px;color:var(--mu)}
.v{font-size:21px;font-weight:650;margin-top:2px}
h2{font-size:16px;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:780px;font-size:14px}
th{font-weight:500;color:var(--mu);font-size:12px;text-align:right;padding:6px 6px}
th:first-child,td:first-child{text-align:left}
td{padding:4px 6px;text-align:right;border-top:1px solid var(--bd);white-space:nowrap}
input{width:100%;min-width:70px;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px;font:inherit;text-align:right}
td:first-child input{text-align:left;min-width:90px}
select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px;font:inherit}
input:focus{outline:2px solid var(--ac);outline-offset:0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.x{padding:2px 8px;color:var(--mu)}
.up{color:var(--up)}.dn{color:var(--dn)}
.bar{height:14px;border-radius:7px;background:var(--bd);overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;border-radius:7px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input[type=range]{width:200px;min-width:0;padding:0;accent-color:var(--ac)}
.note{font-size:14px;margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--bd)}
.foot{color:var(--mu);font-size:12px;margin-top:18px}
.blk{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.blk .blk{background:var(--bg);margin:10px 0 0}
.bh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.bh .sp{flex:1}
.rr{font-size:22px;font-weight:650;color:var(--ac)}
.big{font-size:28px}
.pair{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.pair .blk{margin:0;border-color:var(--ac)}
.pair .card{background:var(--bg)}
.go{cursor:pointer}.go:active{opacity:.7}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--ac)}100%{box-shadow:0 0 0 3px transparent}}.flash{animation:flash 1.6s ease-out}
#toc{display:none}
@media (min-width:1260px){#toc{display:block;position:fixed;top:24px;left:calc(50% - 460px - 190px);width:170px;font-size:14px}
#toc b{display:block;font-size:12px;color:var(--mu);margin:0 0 8px 10px;font-weight:600}
#toc a{display:block;padding:6px 10px;border-left:3px solid var(--bd);color:var(--mu);text-decoration:none;cursor:pointer}
#toc a:hover{color:var(--tx)}#toc a.on{border-left-color:var(--ac);color:var(--ac);font-weight:600}
#toc a.ts{padding-left:22px;font-size:13px}}
h2,#rebs,#sg_stock,#sg_clecw,#sg_clec{scroll-margin-top:16px}
#totop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--ac);font-size:20px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;display:none;z-index:50;padding:0}
.pair .card>.k:first-child{font-size:15px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin:4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.chwrap{margin-bottom:22px}
.chwrap svg,.chwrap .tip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.chwrap svg *{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:12px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25);display:none;z-index:2;line-height:1.6}
</style>
</head>
<body>
<nav id="toc" aria-label="大綱"></nav>
<main>
  <div class="bh" style="justify-content:space-between;margin-bottom:12px"><h1 style="margin:0">股票與負債總覽</h1><span style="display:flex;gap:8px;align-items:center"><span class="k" id="bkm"></span><button class="p" id="bk">備份</button><button id="dk">下載</button></span></div>
  <div class="grid">
    <div class="card"><div class="k">股票市值（折合台幣）</div><div class="v" id="sAssets"></div><div class="k" style="margin-top:4px">損益 <b id="sPL"></b></div></div>
    <div class="card"><div class="k">總負債</div><div class="v" id="sDebt"></div></div>
    <div class="card"><div class="k">淨值</div><div class="v" id="sNet"></div></div>
    <div class="card"><div class="k">股票市值 / 負債</div><div class="v" id="sRatio"></div></div>
  </div>
  <div class="pair" id="pair"></div>

  <div class="card">
    <div class="k">股票市值 vs 負債</div>
    <div class="bar"><i id="bA" style="background:var(--ac)"></i></div>
    <div class="bar"><i id="bD" style="background:var(--debt)"></i></div>
  </div>

  <div class="card row" style="margin-top:18px"><label for="fx">匯率 USD → TWD</label><input type="number" step="any" id="fx" style="width:110px"><button class="p" id="rf">更新報價</button><span class="k" id="rfs">按下後自動更新美股現價、台股收盤價與匯率</span></div>
  <h2>股票</h2>
  <div id="segs"></div>
  <div id="rebs"></div>

  <h2 id="sec_debt">負債 <button class="p" id="addD">＋ 新增</button></h2>
  <div class="card scroll"><table>
    <thead><tr><th data-sk="name" data-b="項目" data-t="d" style="cursor:pointer" title="點一下由大到小排序，再點一次反過來">項目</th><th data-sk="bal" data-b="餘額" data-t="d" style="cursor:pointer" title="點一下由大到小排序，再點一次反過來">餘額</th><th data-sk="rate" data-b="年利率 %" data-t="d" style="cursor:pointer" title="點一下由大到小排序，再點一次反過來">年利率 %</th><th data-sk="pay" data-b="月繳" data-t="d" style="cursor:pointer" title="點一下由大到小排序，再點一次反過來">月繳</th><th data-sk="it" data-b="年利息" data-t="d" style="cursor:pointer" title="點一下由大到小排序，再點一次反過來">年利息</th><th></th></tr></thead>
    <tbody id="debts"></tbody>
  </table></div>

  <h2 id="sec_ret">報酬 vs 利息</h2>
  <div class="card">
    <div class="row">
      <label for="ret">假設股票年報酬率</label>
      <input type="range" id="ret" min="-10" max="20" step="0.5">
      <b id="retV"></b>
    </div>
    <div class="grid" style="margin:12px 0 0">
      <div class="card"><div class="k">預期年收益</div><div class="v" id="gain"></div></div>
      <div class="card"><div class="k">年利息支出</div><div class="v" id="int"></div></div>
      <div class="card"><div class="k">加權平均利率</div><div class="v" id="wr"></div></div>
      <div class="card"><div class="k">每月還款合計</div><div class="v" id="pay"></div></div>
    </div>
    <div class="note" id="msg"></div>
  </div>

  <h2 id="sec_chart">圖表 <span class="row" style="gap:8px"><select id="chd"><option value="0">全部期間</option><option value="30">近 30 天</option><option value="90">近 90 天</option><option value="365">近 1 年</option></select><button class="p" id="chl">載入圖表</button></span></h2>
  <div class="card"><div class="k" id="chm">按「載入圖表」會從你的備份 repo 讀取 portfolio-backup.csv 來畫圖，需先在最下方設定備份 token 與 repo。</div><div id="chs"></div></div>

  <h2 id="sec_cfg">設定</h2>
  <details class="card"><summary>⚙ 連線設定（每個裝置各填一次，只存在這個裝置的瀏覽器）</summary>
    <div style="display:grid;gap:10px;margin-top:12px">
      <label class="k">GitHub token（classic，只勾 gist 權限）<input type="password" id="cgh" autocomplete="off" style="text-align:left;margin-top:4px"></label>
      <label class="k">Finnhub API key（美股報價）<input type="password" id="cfh" autocomplete="off" style="text-align:left;margin-top:4px"></label>
      <label class="k">FinMind token（選填，台股報價上限較高）<input type="password" id="cfm" autocomplete="off" style="text-align:left;margin-top:4px"></label>
      <label class="k">備份用 GitHub token（fine-grained，只授權給備份 repo 的 Contents 讀寫；選填）<input type="password" id="cbt" autocomplete="off" style="text-align:left;margin-top:4px"></label>
      <label class="k">備份 repo（格式：帳號/repo名稱，例如 Ericzyliu/portfolio-backup；選填）<input id="cbr" autocomplete="off" style="text-align:left;margin-top:4px"></label>
      <div class="row"><button class="p" id="csave">儲存並同步</button><span class="k" id="cmsg"></span></div>
    </div>
  </details>

  <div class="foot"><div id="sync" style="margin-bottom:6px"></div>按「更新報價」可更新現價與匯率。試算僅供參考，不構成投資建議。<div style="margin-top:4px">版本 2026-11-12-c</div></div>
</main>
<button id="totop" aria-label="回到最上面" title="回到最上面">↑</button>
<script>
(function(){
var KEY="portfolio-v1",CFG="portfolio-cfg-v1";
var GH="https://api.github.com",DESC="portfolio-tracker-data",FILE="portfolio.json";
var SAMPLE={fx:32,stocks:[{sym:"2330 台積電",cur:"TWD",qty:1000,cost:600,price:900},{sym:"0050 元大台灣50",cur:"TWD",qty:2000,cost:120,price:150},{sym:"AAPL",cur:"USD",qty:20,cost:150,price:230}],debts:[{name:"房貸",bal:5000000,rate:2.2,pay:28000},{name:"信貸",bal:400000,rate:4.5,pay:12000}],ret:6};
var cfg={gh:"",fh:"",fm:"",gid:""};
try{var c0=JSON.parse(localStorage.getItem(CFG)||"{}");for(var k0 in c0)cfg[k0]=c0[k0]}catch(e){}
function saveCfg(){try{localStorage.setItem(CFG,JSON.stringify(cfg))}catch(e){}}
var $=function(id){return document.getElementById(id)};
var fmt=function(n){return Math.round(n).toLocaleString("zh-TW")};
var pct=function(n){return (isFinite(n)?n:0).toFixed(1)+"%"};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function tm(){return new Date().toLocaleTimeString("zh-TW")}
function norm(o){if(!o.fx)o.fx=32;if(o.ret==null)o.ret=6;if(o.up==null)o.up=30;if(o.dn==null)o.dn=2;if(!o.st)o.st=1;if(!o.tr)o.tr={proto:50,lev:30,cash:20};if(o.nw==null)o.nw=0;if(!o.w)o.w={};var w=o.w;if(w.up==null)w.up=30;if(w.dn==null)w.dn=2;if(!w.st)w.st=1;if(!w.tr)w.tr={proto:50,lev:30,cash:20};if(w.nw==null)w.nw=0;o.stocks.forEach(function(s){if(!s.cur)s.cur="TWD";if(!s.g)s.g="stock"});return o}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.stocks&&o.debts)return norm(o)}}catch(e){}return norm(JSON.parse(JSON.stringify(SAMPLE)))}
var S=load(),quiet=false,synced=false,tmr=null;
function setSync(t){$("sync").textContent=t+"（本頁已呼叫 GitHub "+reqN+" 次）"}
function save(){if(!quiet)S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!quiet)push()}

/* ---------- GitHub Gist 同步 ---------- */
var reqN=0,etag="",lastRu=0,blockUntil=0;
function ghf(path,opt){
  opt=opt||{};var inm=opt.inm;delete opt.inm;
  opt.headers={"Authorization":"Bearer "+cfg.gh,"Accept":"application/vnd.github+json"};
  if(inm)opt.headers["If-None-Match"]=inm;
  if(Date.now()<blockUntil)return Promise.reject(new Error("GitHub API 次數用完，約 "+new Date(blockUntil).toLocaleTimeString("zh-TW")+" 恢復後自動重試"));
  reqN++;
  return fetch(GH+path,opt).then(function(r){
    if(r.status===304)return {nm:true};
    if(r.ok){if(!opt.method&&path.indexOf("/gists/")===0)etag=r.headers.get("etag")||"";return r.json()}
    return r.json().catch(function(){return{}}).then(function(b){
      var m=String(b.message||"").split(". If you reach")[0],rs=r.headers.get("x-ratelimit-reset");
      if(r.headers.get("x-ratelimit-remaining")==="0"&&rs){blockUntil=(+rs)*1000;m="API 次數用完，約 "+new Date(blockUntil).toLocaleTimeString("zh-TW")+" 恢復後自動重試"}
      throw new Error("GitHub "+r.status+(r.status===401?"（token 無效）":"")+(m?"："+m:""));
    });
  });
}
function findGist(){
  if(cfg.gid)return Promise.resolve(cfg.gid);
  return ghf("/gists?per_page=100").then(function(l){
    var g=l.filter(function(x){return x.description===DESC})[0];
    if(g){cfg.gid=g.id;saveCfg();return g.id}
    return null;
  });
}
function createGist(){
  var f={};f[FILE]={content:JSON.stringify(S)};
  return ghf("/gists",{method:"POST",body:JSON.stringify({description:DESC,public:false,files:f})}).then(function(g){cfg.gid=g.id;saveCfg();return g.id});
}
function push(){
  if(!cfg.gh||!synced||!cfg.gid)return;
  setSync("同步中…");clearTimeout(tmr);
  tmr=setTimeout(function(){
    var f={};f[FILE]={content:JSON.stringify(S)};
    ghf("/gists/"+cfg.gid,{method:"PATCH",body:JSON.stringify({files:f})}).then(function(){lastRu=S.updated||0;etag="";setSync("☁️ 已同步（"+tm()+"）")}).catch(function(e){setSync("同步失敗："+e.message+"，資料仍保存在這個裝置")});
  },800);
}
function editing(){var a=document.activeElement;return a&&a.tagName==="INPUT"&&a.id!=="ret"&&a.id!=="cgh"&&a.id!=="cfh"&&a.id!=="cfm"&&a.id!=="cbt"&&a.id!=="cbr"}
function applyRemote(r){S=norm(JSON.parse(JSON.stringify(r)));quiet=true;$("ret").value=S.ret;$("fx").value=S.fx;rows();quiet=false}
function pull(){
  if(!cfg.gh){synced=false;setSync("尚未設定 GitHub token：資料只存在這個裝置");return Promise.resolve()}
  setSync("同步中…");
  return findGist().then(function(id){
    if(!id){if(!S.updated)S.updated=Date.now();return createGist().then(function(){synced=true;setSync("☁️ 已建立雲端資料（"+tm()+"）")})}
    return ghf("/gists/"+id,{inm:etag}).then(function(g){if(g.nm){synced=true;if((S.updated||0)>lastRu)push();setSync("☁️ 已同步（"+tm()+"）");return}
      var f=g.files&&g.files[FILE];
      synced=true;
      if(!f||!f.content){if(!S.updated)S.updated=Date.now();push();return}
      var r=JSON.parse(f.content);
      if(!r||!r.stocks||!r.debts)throw new Error("雲端資料格式不對");
      var ru=r.updated||0,lu=S.updated||0;lastRu=ru;
      if(ru>lu){if(editing()){setSync("雲端有新資料，編輯完會自動套用");return}applyRemote(r)}
      else if(lu>ru){push();return}
      setSync("☁️ 已同步（"+tm()+"）");
    });
  }).catch(function(e){
    if(/404/.test(e.message)){cfg.gid="";saveCfg()}
    setSync("同步失敗："+e.message+"，資料仍保存在這個裝置");
  });
}

var SO={s:null,d:null};
function val(s,k){var r=s.cur==="USD"?S.fx:1,v=s.qty*s.price;return k==="mv"?v:k==="pl"?(v-s.qty*s.cost)*r:k==="tw"?v*r:s[k]}
function dval(d,k){return k==="it"?d.bal*d.rate/100:d[k]}
function order(arr,so,vf){var ix=arr.map(function(_,i){return i});if(so)ix.sort(function(a,b){var x=vf(arr[a],so.k),y=vf(arr[b],so.k);return (typeof x==="string"?String(x).localeCompare(String(y),"zh-TW"):x-y)*so.d});return ix}
function marks(){document.querySelectorAll("th[data-sk]").forEach(function(th){var so=th.getAttribute("data-t")==="d"?SO.d:SO.s;th.textContent=th.getAttribute("data-b")+(so&&so.k===th.getAttribute("data-sk")?(so.d<0?" ▼":" ▲"):"")})}
var G=[{k:"stock",n:"個股"},{k:"proto",n:"原型"},{k:"lev",n:"槓桿 x2"},{k:"cash",n:"類現金"},{k:"tproto",n:"原型"},{k:"tlev",n:"槓桿 x2"},{k:"tcash",n:"類現金"}];
var CL=[{pf:"w",id:"clecw",n:"CLEC-TW",k:{p:"tproto",l:"tlev",c:"tcash"}},{pf:"",id:"clec",n:"CLEC-US",k:{p:"proto",l:"lev",c:"cash"}}];
var TH='<thead><tr>'+[["股票","sym"],["幣別","cur"],["股數","qty"],["成本價","cost"],["現價","price"],["市值","mv"],["損益（台幣）","pl"],["折合台幣","tw"]].map(function(c){return '<th data-sk="'+c[1]+'" data-b="'+c[0]+'" data-t="s" style="cursor:pointer" title="點一下由大到小排序，再點一次反過來">'+c[0]+'</th>'}).join('')+'<th></th></tr></thead>';
function seg(g,lbl){return '<div id="sg_'+g.k+'" class="'+(g.k==="stock"?'blk':'blk sub')+'"><div class="bh"><b>'+g.n+'</b><span class="k">市值 <b id="v_'+g.k+'"></b>　損益 <b id="p_'+g.k+'"></b></span><span class="k" style="font-size:14px">'+lbl+' <b class="rr" id="r_'+g.k+'"></b></span><span class="sp"></span><button class="p" data-add="'+g.k+'">＋ 新增</button></div><div class="scroll"><table>'+TH+'<tbody id="tb_'+g.k+'"></tbody></table></div></div>'}
function clecBlk(c){return '<div id="sg_'+c.id+'" class="blk" style="border-color:var(--ac)"><div class="bh"><b>'+c.n+' 投資組合</b><span class="k">市值 <b id="v_'+c.id+'"></b>　損益 <b id="p_'+c.id+'"></b></span><span class="k" style="font-size:14px">佔整個資產 <b class="rr" id="r_'+c.id+'"></b></span></div>'+[c.k.p,c.k.l,c.k.c].map(function(k){return seg(G.filter(function(g){return g.k===k})[0],"佔 "+c.n)}).join("")+'</div>'}
var backY=null;
function curY(){return window.pageYOffset||document.documentElement.scrollTop||0}
function rememberPos(){if(backY==null)backY=curY()}
document.addEventListener("click",function(e){var c=e.target.closest&&e.target.closest("[data-go]");if(!c)return;var t=$("sg_"+c.getAttribute("data-go"));if(!t)return;rememberPos();t.scrollIntoView({behavior:"smooth",block:"start"});t.classList.remove("flash");void t.offsetWidth;t.classList.add("flash")});

    ks.forEach(function(k){d[k]=tv[k]/ts*Tt-tg[k]});

var API_BASE_URL="https://finnhub.io/api/v1/quote?symbol=";
var API_FOREX_URL="https://open.er-api.com/v6/latest/USD";
var FINMIND_URL="https://api.finmindtrade.com/api/v4/data";
var lastErr="";
function tick(s){return String(s.sym||"").trim().split(/\s+/)[0].toUpperCase()}
function tw(s,t,jobs,fail,hit){
  if(!/^\d{4,6}[A-Z]?$/.test(t)){fail.push(t);return}
  var from=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
  var u=FINMIND_URL+"?dataset=TaiwanStockPrice&data_id="+t+"&start_date="+from+(cfg.fm?"&token="+encodeURIComponent(cfg.fm):"");
  jobs.push(fetch(u).then(function(r){return r.json()}).then(function(d){
    var a=d&&d.data;
    if(a&&a.length&&a[a.length-1].close>0){s.price=a[a.length-1].close;hit()}else fail.push(t)
  }).catch(function(e){lastErr=String(e&&e.message||e);fail.push(t)}));
}
function refresh(){
  var b=$("rf"),st=$("rfs"),ok=0,fail=[],jobs=[];
  b.disabled=true;st.textContent="更新中…";lastErr="";
  jobs.push(fetch(API_FOREX_URL).then(function(r){return r.json()}).then(function(d){
    if(d&&d.rates&&d.rates.TWD>0){S.fx=d.rates.TWD;$("fx").value=S.fx.toFixed(3);ok++}else fail.push("匯率")
  }).catch(function(e){lastErr=String(e&&e.message||e);fail.push("匯率")}));
  S.stocks.forEach(function(s){
    var t=tick(s);if(!t)return;
    if(s.cur!=="USD"){tw(s,t,jobs,fail,function(){ok++});return}
    if(!cfg.fh){fail.push(t);lastErr="尚未設定 Finnhub key";return}
    jobs.push(fetch(API_BASE_URL+encodeURIComponent(t)+"&token="+encodeURIComponent(cfg.fh)).then(function(r){return r.json()}).then(function(d){
      if(d&&d.c>0){s.price=d.c;ok++}else fail.push(t)
    }).catch(function(e){lastErr=String(e&&e.message||e);fail.push(t)}));
  });
  Promise.all(jobs).then(function(){
    rows();b.disabled=false;
    if(CHR.loaded){CHR.live=bkRun("live");drawAll()}
    st.textContent="已更新 "+ok+" 項"+(fail.length?"；失敗："+fail.join("、")+(lastErr?"［原因："+lastErr+"］":""):"")+"（"+tm()+"）；台股為最近一個交易日收盤價";
  });
}

  var sel=function(id,arr,cur){return'<select id="'+id+'">'+arr.map(function(x,i){return'<option value="'+i+'"'+(i===cur?" selected":"")+'>'+x[0]+'</option>'}).join("")+'</select>'};
  var blk=function(t,id,extra,last){return'<div class="chwrap"'+(last?' style="margin-bottom:0"':'')+'><div class="bh"><b>'+t+'</b>'+(extra||"")+'</div><div id="'+id+'"></div></div>'};
  $("chs").innerHTML='<div style="margin-top:12px"></div>'+blk("市值 ＋ 損益（台幣）","ch0",sel("chsc",SCOPES,CHR.scope))+blk("股票市值的組成：淨值 vs 總負債（%）＋ 股票市值 / 負債（%，右軸）","ch1")+blk("各部位佔整個資產（%）","ch3")+blk("各部位損益 %（損益 ÷ 成本）","ch4")+blk("CLEC 內各類損益 %（損益 ÷ 成本）","ch5",sel("chcl",CLS,CHR.cl),true);
  $("chsc").onchange=function(){CHR.scope=+$("chsc").value;drawAll()};
  $("chcl").onchange=function(){CHR.cl=+$("chcl").value;drawAll()};
  drawAll();
}
function loadCharts(){
  var m=$("chm");
  if(!(cfg.bt&&cfg.br)){m.textContent="請先在最下方「設定」填寫備份 token 與備份 repo。";return}
  m.textContent="載入中…";$("chl").disabled=true;
  fetch(GH+"/repos/"+cfg.br+"/contents/portfolio-backup.csv",{headers:{"Authorization":"Bearer "+cfg.bt,"Accept":"application/vnd.github.raw+json"},cache:"no-store"}).then(function(r){
    if(r.status===404)throw new Error("repo 裡還沒有備份檔，請先按「備份」");
    if(!r.ok)return r.json().catch(function(){return{}}).then(function(b){throw new Error("GitHub "+r.status+(b.message?"："+String(b.message).split(". If you reach")[0]:""))});
    return r.text();
  }).then(function(t){CHR.rows=bakRows(t);CHR.live=bkRun("live");CHR.loaded=true;m.textContent="已載入 "+CHR.rows.length+" 筆備份（"+tm()+"）。同一天有多筆時，圖上只取當天最新一筆；今天這一點用的是目前畫面上的數字（按「更新報價」會一併更新，尚未備份）；沒備份的日子不留空。滑鼠移到圖上或手指點圖，可看該日的數字。";buildCharts()}).catch(function(e){m.textContent="載入失敗："+e.message}).then(function(){$("chl").disabled=false});
}
$("chl").onclick=loadCharts;
$("chd").onchange=function(){CHR.days=+$("chd").value;if(CHR.loaded)drawAll()};
var rzt;window.addEventListener("resize",function(){clearTimeout(rzt);rzt=setTimeout(function(){if(CHR.loaded)drawAll()},200)});

/* ---------- 啟動 ---------- */
$("ret").value=S.ret;$("fx").value=S.fx;
quiet=true;rows();quiet=false;
pull();
setInterval(function(){if(!document.hidden)pull()},120000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()});
})();
</script>
